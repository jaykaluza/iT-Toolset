<style>
:root{color-scheme:only light;--bg:#f5f5f7;--panel:#fff;--panel-2:#e8e8ed;--text:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--accent:#0066cc;--brand:#0071e3;--head:#161617;--head-text:#f5f5f7;--head-muted:#a1a1a6;
  --crit:#b00020;--crit-bg:rgba(215,0,21,.10);--high:#c2410c;--high-bg:rgba(255,120,0,.11);--med:#a05a00;--med-bg:rgba(255,204,0,.16);--low:#6e6e73;--low-bg:rgba(110,110,115,.10);--good:#17803d;--good-bg:rgba(30,160,80,.11);--red:#8c1515}
*{box-sizing:border-box}
html{overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--head);color:var(--head-text);padding:7px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:6px}
h1{font:600 17.3px/1.2 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;letter-spacing:-.025em;margin:0;color:#fff}
h1 a{color:inherit;text-decoration:none}h1 a:hover{text-decoration:underline}
.sub{color:var(--head-muted);font-size:13px}.warn{color:#ffd60a}
#openlog,#quit{align-self:center;font:inherit;font-size:11px;font-weight:500;border-radius:980px;padding:1px 9px;cursor:pointer}
#openlog{margin-left:auto;color:#72a3f7;background:transparent;border:1px solid #4d74b5}#openlog:hover{background:rgba(114,163,247,.14)}
#quit{color:#fff;background:#8c1515;border:1px solid #8c1515}#quit:hover{background:#820000}
.stats{display:flex;flex-wrap:nowrap;gap:5px;padding:2px 16px}
.stat{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:6px;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:8px;padding:2px 8px}
.stat b{font-size:13px;line-height:1.3;font-weight:700}.stat span{color:var(--muted);font-size:11px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stat.c-critical{border-color:var(--crit);background:var(--crit-bg)}.stat.c-critical b{color:var(--crit)}.stat.c-high{border-color:var(--high);background:var(--high-bg)}.stat.c-high b{color:var(--high)}.stat.c-medium{border-color:var(--med);background:var(--med-bg)}.stat.c-good{border-color:var(--good);background:var(--good-bg)}.stat.c-good b{color:var(--good)}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 16px}
.tabs{display:flex;flex-wrap:wrap;gap:2px 3px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);padding:3px 10px;border-radius:980px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--brand);color:#fff}.tabs button.auto{font-weight:600;color:var(--text)}.tabs button.auto.on{color:#fff}
.tabs .n{display:inline-block;min-width:15px;margin-left:4px;padding:0 4px;border-radius:99px;background:var(--high);color:#fff;font-size:10.5px;font-weight:700;text-align:center;line-height:15px}.tabs .n.critical{background:var(--crit)}.tabs .n.medium{background:var(--med)}
input[type=search],input[type=number],select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:980px;padding:4px 10px}
input[type=search]{flex:0 1 190px;min-width:110px;width:190px}
label.tog{color:var(--muted);display:flex;gap:7px;align-items:center;cursor:pointer}
label.tog input{appearance:none;-webkit-appearance:none;flex:none;width:34px;height:18px;margin:0;border-radius:9px;background:#d1d1d6;position:relative;cursor:pointer;transition:background .15s}
label.tog input::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
label.tog input:checked{background:var(--brand)}label.tog input:checked::after{left:18px}label.tog:has(input:checked){color:var(--text)}
.btn{font:inherit;font-size:11px;font-weight:500;border-radius:980px;padding:1px 9px;cursor:pointer;color:var(--accent);background:transparent;border:1px solid var(--accent);white-space:nowrap}
.btn:hover{background:rgba(0,113,227,.1)}.btn.danger{color:#fff;background:#8c1515;border-color:#8c1515}.btn.danger:hover{background:#820000}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{font-size:13px;padding:7px 22px;font-weight:600}.btn.solid{color:#fff;background:var(--brand);border-color:var(--brand)}.btn.solid:hover{background:#0077ed}
.wrap{padding:0 16px 30px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;table-layout:fixed}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--panel)}tr:last-child td{border-bottom:0}
tr.s-critical td{background:var(--crit-bg)}tr.s-high td{background:var(--high-bg)}tr.s-medium td{background:var(--med-bg)}
.pill{display:inline-block;padding:0 7px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.qdir{user-select:all;word-break:break-all}
.pill.kind{background:var(--panel-2);color:var(--muted)}
.p-critical{color:#fff;background:var(--crit)}.p-high{color:#fff;background:var(--high)}.p-medium{color:var(--med);background:var(--med-bg);border:1px solid var(--med)}.p-low{color:var(--low);background:var(--low-bg)}.p-info{color:var(--accent);background:rgba(0,113,227,.1)}.p-ok{color:var(--good);background:var(--good-bg)}.p-done{color:#fff;background:var(--good)}
.title{font-weight:600}.small{color:var(--muted);font-size:12px}.mono{font:11.5px Consolas,monospace;color:var(--muted);white-space:pre-wrap;word-break:break-all}
.note{background:var(--panel-2);color:var(--muted);border-radius:12px;padding:9px 14px;margin:0 0 10px;line-height:1.5;font-size:12px}.note b{color:var(--text);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--muted)}
h3{font-size:14px;font-weight:600;margin:16px 0 4px}h3:first-child{margin-top:0}h3 .small{font-weight:400}
.hero{display:flex;flex-wrap:wrap;gap:16px 26px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}
.score{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:700 25px/1 -apple-system,"Segoe UI",system-ui;color:#fff;background:var(--low)}.score.good{background:var(--good)}.score.fair{background:var(--med)}.score.poor{background:var(--high)}.score.bad{background:var(--crit)}
.hero .txt{flex:1 1 320px;min-width:0}.hero .txt b.v{font-size:16px;font-weight:600;display:block;margin-bottom:2px}
.progress{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--brand);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.chip{font-size:11px;padding:0 7px;border-radius:99px;background:var(--panel-2);color:var(--muted);white-space:nowrap}.chip.done{background:var(--good-bg);color:var(--good)}.chip.running{background:var(--brand);color:#fff}.chip.error{background:var(--crit-bg);color:var(--crit)}
.chip[data-chip]{cursor:pointer}.chip[data-chip]:hover{outline:1px solid currentColor}.chip.pick{outline:2px solid var(--brand);background:var(--brand);color:#fff}
.chip .cn{font-style:normal;font-weight:700;margin-left:5px}
.score.filtered{cursor:pointer;flex-direction:column;display:flex;justify-content:center;align-items:center;gap:4px}.score small{font-size:10px;font-weight:600;letter-spacing:.02em}
.how{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px;margin-bottom:10px;font-size:13px}.how summary{cursor:pointer;font-weight:600}.how p{margin:6px 0}
.howtest{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 14px;margin:0 0 10px;font-size:12px}.howtest summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none}.howtest summary::-webkit-details-marker{display:none}.howtest summary b{font-style:normal}.howtest p{margin:7px 0 2px;color:var(--muted);line-height:1.5}
.checks{display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.chk{display:flex;align-items:center;gap:9px;padding:7px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.chk .mk{font-weight:800;width:15px;text-align:center;flex:none}
.chk .nm{font-weight:600}
.chk.ok .mk{color:#1a9d4b}
.chk.ok .st{margin-left:auto;color:#1a9d4b;font-weight:700;font-size:12px}
.chk.bad{border-color:#e0b33a;background:var(--panel-2)}
.chk.bad .mk{color:#c0392b}
.chk.bad .st{margin-left:10px;color:var(--muted);line-height:1.4}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px}
.card.critical{border-left-color:var(--crit)}.card.high{border-left-color:var(--high)}.card.medium{border-left-color:var(--med)}.card.low{border-left-color:var(--low)}.card.ok{border-left-color:var(--good)}
.card .top{display:flex;gap:8px;align-items:baseline}.card .top .title{flex:1;min-width:0}.card .top .acts{flex:none;display:flex;gap:5px}
.card p{margin:3px 0 0}.card .why{color:var(--text)}.card .hint{color:var(--muted);font-size:12px}
.card .mono{margin-top:4px;max-height:92px;overflow:auto}
a.link{color:var(--accent);text-decoration:none;cursor:pointer}a.link:hover{text-decoration:underline}
[data-tip]{cursor:help}
.v-safe{color:var(--good);background:var(--good-bg)}.v-weak{color:var(--med);background:var(--med-bg);border:1px solid var(--med)}.v-block{color:#fff;background:var(--crit)}
.ver{font-size:12px;line-height:1.35}.ver .pill{font-size:11px;margin-right:4px}
#tip .vi{margin-top:4px}#tip .vi .pill{font-size:11px;margin-right:5px}#tip .vi i{font-style:normal;color:var(--muted)}
#tip{position:fixed;z-index:10;width:400px;max-width:calc(100vw - 16px);background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px;pointer-events:none;display:none}
#tip h4{margin:0 0 6px;font-size:14px}#tip b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:7px}#tip .path{font:11.5px Consolas,monospace;word-break:break-all;color:var(--muted)}
.chk .nm[data-help]{cursor:help;text-decoration:underline dotted;text-underline-offset:2px;text-decoration-color:var(--muted)}
#htip{position:fixed;z-index:13;width:420px;max-width:calc(100vw - 16px);max-height:min(60vh,360px);overflow-y:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px;line-height:1.45;display:none}
#htip h4{margin:0 0 6px;font-size:14px}#htip b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:9px}#htip p{margin:2px 0 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:12;max-width:min(560px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none}#toast.bad{border-left-color:var(--crit)}
.form{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
@media (max-width:760px){.stats{flex-wrap:wrap}table{table-layout:auto}}
</style>

<body>
<header><h1><a href="https://jaykaluza.github.io/iT-Toolset/" target="nesiam-landing" title="Go to the Nesiam.com landing page">my_security</a></h1><span class="sub" id="meta">Starting up…</span><button id="openlog" title="Open activity-log.txt: every detection, fix, block and undo from the last 30 days">Activity log</button><button id="quit" title="Stop My Security and close the app">Stop</button></header>
<div class="stats" id="stats"></div>
<div class="bar"><div class="tabs" id="tabs"></div><input type="search" id="q" placeholder="Filter…"><label class="tog"><input type="checkbox" id="problems"> Problems only</label><button class="btn" id="rescan">Scan this tab</button></div>
<div class="wrap" id="view"></div>
<div id="tip"></div><div id="htip"></div><div id="toast"></div>
<script>
const TOKEN = '__MYSEC_TOKEN__';
const TABS = [['auto','Autopilot',[]],['ports','Ports',['ports']],['shares','Shares',['shares']],['protocols','Protocols',['protocols']],['accounts','Accounts',['accounts','adminsetup']],['services','Services',['services']],['system','System',['system']],
  ['firewall','Firewall',['firewall']],['backdoors','Hacker tricks',['tricks']],['lateral','Lateral',['lateral']],['pentest','Pentest',['pentest','creds']],['exposure','Exposure',['exposure','outside']],
  ['malware','Malware',['malware']],['processes','Processes',[]],['downloads','Downloads',['downloads']],['apps','Apps',['apps','userapps']],['patches','Patches',['patches']],['threats','Threats',['threats','attacks']],['browsers','Browsers',['browsers','extensions']],['events','Events',['events']],['health','Health',['health','cleanup']],['blocked','Blocked',[]],['quarantine','Quarantine',[]]];
const LEAD = {shares:'Shared folders and how Windows file sharing (SMB) is set up. This is the most attacked part of Windows.',protocols:'Old network languages that attackers abuse. Most can be turned off with no effect on modern devices.',accounts:'Who can sign in and who has administrator rights.',services:'Background programs that start with Windows, and remote-control tools that can act as a back door.',system:'The main protections: antivirus, firewall, User Account Control, disk encryption, and signs that traffic is being redirected.',malware:'Signs of malware, spyware and keyloggers, and everything that starts automatically.',downloads:'Programs and scripts in Downloads, Desktop, Documents and temporary folders. Clearing moves a file to quarantine, which can be undone.',patches:'Missing Windows updates.',apps:'Apps with newer versions, and apps installed only for this user, with what makes each one risky.',firewall:'Rules that let the network in. These are the rules attackers add or abuse.',backdoors:'The places attackers hide so they survive a restart, and the settings they change to get more rights.',lateral:'How an intruder could move from this PC to your other devices, or into this PC from them. Close the doors here. While the app is open it also warns you when an account gains admin rights or a suspicious service appears.',pentest:'Can a normal account or malware on this PC get more privileges? Each test checks a known route to full control. It only looks: nothing is exploited or changed.',exposure:'What this PC and your connection expose to others. On your network: Wi-Fi security and look-alike networks, devices answering SNMP with the factory password, web servers and developer tools running here, and signs of a fake router. From the internet: what the outside can see. It only looks: nothing is exploited or changed.',events:'Errors and critical events from Event Viewer in the last 7 days, explained.',health:'What is slowing this PC down, memory leaks, disks that are filling up or failing, and browsing data and temporary files to clear.'};
const PROBE_INFO = {pentest:'Each item runs one read-only test for a known way a standard account or malware could gain more control. The twelve checks: always-elevated installers (AlwaysInstallElevated), programs a standard user can overwrite, writable SYSTEM scheduled-task files, weak service permissions, writable folders in the system PATH, read access to the password database (SAM), dangerous account privileges, Windows answer files holding passwords, passwords in command history, saved Windows credentials, print-driver settings (PrintNightmare), and what your network can reach. It only reads settings, the registry, file and folder permissions, and the list of running programs — nothing is attacked, and nothing on this PC is changed or written to disk unless you press a fix button, which always asks first and can be undone from the Blocked tab.',exposure:'These checks only look. On your network they read your Wi-Fi settings, ask your router and this PC a single read-only SNMP question, and open one page on any web server running here. From the internet they look up what public scanners have already recorded about your address. Nothing is attacked, and nothing on this PC is changed or written to disk — unless you press a fix button, which always asks first.'};
const CHECK_HELP = {
  'Always-elevated installers': {what:'A Windows policy (AlwaysInstallElevated) that lets any .msi installer run as SYSTEM — the highest level on the PC — no matter who starts it.', how:'A standard user or malware builds a tiny malicious .msi and launches it. Because the policy forces it to run elevated, the payload inside runs as SYSTEM and takes over the machine. It is one of the most reliable local privilege-escalation tricks.', best:'Leave both the per-machine and per-user AlwaysInstallElevated values off (the Windows default). Never enable them to make software installs easier.'},
  'Writable service files': {what:'The program file (.exe) a Windows service runs is sitting in a folder a normal user is allowed to overwrite.', how:'An attacker replaces the service\'s .exe with their own, then waits for the service to start — or restarts the PC. The service runs the replacement with the service\'s account, usually SYSTEM.', best:'Install services under Program Files or System32, where only administrators can write. Remove write access for standard users from any service\'s install folder.'},
  'Writable SYSTEM task files': {what:'A scheduled task that runs as SYSTEM points at a script or program a standard user can edit.', how:'The attacker rewrites the file the task runs. The next time the task fires — on a timer, at logon, or on an event — their code runs with SYSTEM rights.', best:'Keep files used by SYSTEM-level scheduled tasks in admin-only locations, and review task actions for anything living in user-writable folders.'},
  'Weak service permissions': {what:'A service\'s own configuration can be changed by a standard user — for example they can alter what program it launches or which account it uses.', how:'Instead of replacing a file, the attacker just reconfigures the service to run their command (sc config binPath=…), then starts it. It runs as the service account.', best:'Services should only be configurable by administrators. Remove change/write permissions granted to ordinary users or groups like Authenticated Users.'},
  'Writable system PATH folders': {what:'A folder listed in the system PATH can be written to by standard users, and PATH is how Windows finds programs by name.', how:'The attacker drops a malicious file named like a common tool (or a missing DLL) into the writable PATH folder. When a privileged program or service calls that name, Windows finds the attacker\'s copy first and runs it.', best:'Every folder on the system PATH should be writable only by administrators. Remove user-writable directories from PATH.'},
  'Password database permissions': {what:'The SAM hive — the file holding local account password hashes — is readable by accounts that should not have access.', how:'The attacker copies the SAM (and SYSTEM) hive, extracts the password hashes offline, then cracks them or uses them directly in pass-the-hash attacks to log in as other users, including administrators.', best:'Only SYSTEM and Administrators should read the SAM. This is the default; a loosened permission (sometimes called HiveNightmare/SeriousSAM) must be corrected and old shadow copies cleared.'},
  'Dangerous account privileges': {what:'The current account holds a Windows privilege that can be turned into full control — such as SeImpersonate, SeDebug, SeBackup, SeRestore, SeTakeOwnership or SeLoadDriver.', how:'Each of these is a known escalation route: impersonation privileges feed "potato" attacks that steal a SYSTEM token; backup/restore read protected files; load-driver installs a malicious kernel driver. Service accounts often carry them unnecessarily.', best:'Grant these privileges only to accounts that truly need them. Audit service accounts and remove powerful rights they do not use.'},
  'Answer files with passwords': {what:'Windows setup answer files (Unattend.xml, sysprep.inf, Autounattend.xml) left on disk, sometimes containing the local administrator password.', how:'These files are created during automated installs. Attackers search well-known paths for them; a stored administrator password — even base64-encoded — lets them log straight in as admin.', best:'Delete answer files after setup. Never leave credentials in them, and scrub deployment images before use.'},
  'Passwords in command history': {what:'PowerShell console history (and similar files) holding commands that contain passwords, keys or tokens typed in plain text.', how:'The history file is saved per user and is easy to read. Anyone who reaches the account — or a later attacker on the box — harvests any secret that was ever typed on a command line.', best:'Avoid passing secrets as command-line arguments. Clear PowerShell history (or disable it) after any command that contained a credential.'},
  'Saved Windows credentials': {what:'Credentials stored in Windows Credential Manager (via cmdkey/runas /savecred) that let a program sign in to another account or machine without a prompt.', how:'An attacker lists saved credentials and runs their own command with runas /savecred, borrowing the stored login — often an admin or domain account — without ever knowing the password.', best:'Avoid storing reusable credentials, especially privileged ones. Remove saved entries you no longer need from Credential Manager.'},
  'Print driver settings': {what:'Print Spooler settings that allow non-administrators to install printer drivers (the PrintNightmare family of flaws).', how:'A standard user or remote attacker installs a malicious "printer driver," which Windows loads with SYSTEM rights — giving instant code execution as SYSTEM, locally or across the network.', best:'Keep Windows fully patched and set the policy so only administrators can add printer drivers. Disable the Print Spooler on machines that do not print.'},
  'What your network can reach': {what:'A view of which of your other devices this PC can connect to, and over which ports — the paths an intruder on this machine would use to spread.', how:'Once an attacker controls this PC, they pivot: they scan the reachable devices and attack open services (file shares, remote desktop, management ports) to move laterally across your network.', best:'Limit what each device exposes to the local network, close unused services and ports, and segment sensitive devices so a single compromised PC cannot reach everything.'}
};
const SEVL = {critical:'Critical',high:'High',medium:'Medium',low:'Low',info:'Info',ok:'OK'}, RANK = {critical:4,high:3,medium:2,low:1,info:0,ok:-1};
const S = {tab:'auto', q:'', problems:false, chips:new Set(), how:false, howtest:false};
try { S.tab = localStorage.getItem('mysec-tab') || 'auto'; } catch(e) {}
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeLink = u => /^https:\/\//i.test(String(u||'')) ? esc(u) : '';
const pill = s => `<span class="pill p-${s}">${SEVL[s]}</span>`;
const time = t => t ? new Date(t).toLocaleTimeString() : '';
let D = null, BUSY = new Set(), REV = 0;
const hit = o => { const q = S.q.trim().toLowerCase(); return !q || JSON.stringify(o).toLowerCase().includes(q); };

function findings(tab) { const t = TABS.find(x => x[0] === tab); return t[2].flatMap(c => (D.scans[c] || {findings: []}).findings); }
function actButton(f) {
  if (f.Done) return '<span class="pill p-done">Done</span>';
  if (!f.Action) return '';
  const danger = /block|end|remove|turn off|stop|quarantine|disable/i.test(f.Action.label);

// ---- Threats

// ---- Blocked
const KIND = {port: 'Port', address: 'Address', program: 'Program'};
function attemptsSection(tbl) {
  const a = D.attempts || {}, b = D.blocks, any = b.ports.length + b.ips.length + b.programs.length;
  const head = `<h3>Blocked attempts <span class="small">connections Windows Firewall refused because of your blocks</span></h3>`;
  if (!D.admin) return head + '<div class="small">Needs Administrator rights: only Administrators can read the firewall\'s record. MySecurity.exe asks for them by itself.</div>';
  if (a.on == null) return head + '<div class="small">Checking…</div>';
  if (!a.on) return head + `<div class="note">Windows Firewall is not writing down the connections it refuses, so there is nothing to show yet. <b>Start recording</b> turns that on (it is a Windows setting, "log dropped packets"). It uses up to 16 MB of disk and doesn't slow the PC. Stop recording puts it back as it was.<div style="margin-top:8px"><button class="btn solid" data-rec="1">Start recording</button></div></div>` +
    (a.rows.length ? attemptsTable(tbl, a.rows) : '');
  const since = a.since ? `Recorded since ${esc(a.since.slice(0, 16))}` : 'Recording, nothing refused yet';
  const bar = `<div class="small" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">${since}. Updated ${time(a.at)}, every minute. <button class="btn" data-rec="0">Stop recording</button></div>`;

    const where = r.Local ? 'your network' : 'the internet';

    const first = r.Count > 1 && r.First !== r.Last ? `<div class="small">first ${esc(r.First.slice(0, 16))}</div>` : '';
    return `<tr><td>${esc(r.Last.slice(0, 16))}${first}</td><td><span class="pill kind">${KIND[r.Kind] || ''}</span> ${esc(r.Blocked)}</td><td>${what}</td><td>${esc(r.Ports.join(', '))}</td><td><b>${r.Count}</b></td></tr>`;

const SCORE = s => s == null ? ['', '—'] : s >= 85 ? ['good', s] : s >= 65 ? ['fair', s] : s >= 40 ? ['poor', s] : ['bad', s];
function verdict() {
  const c = D.counts;
  if (D.job) return ['Autopilot is checking this PC…', 'You can keep working. Results appear as each check finishes.'];
  if (!D.ran) return ['Press Autopilot to check this PC', 'It runs every scan, then tells you what is critical and what can wait. Nothing is changed unless you press a Fix button and confirm.'];
  if (c.critical) return [`${c.critical} critical problem${c.critical > 1 ? 's' : ''} to fix now`, 'Start at the top. These are the ones an attacker could use today, or signs that something is already wrong.'];
  if (c.high) return [`Nothing critical. ${c.high} important item${c.high > 1 ? 's' : ''} for this week`, 'No emergency, but do not leave these for long.'];
  if (c.medium) return ['This PC is in good shape', 'A few improvements are listed below for when you have time.'];
  return ['No problems found', 'Run Autopilot again every week or so, and after installing anything new.'];
}
function bucket(title, sub, items) {
  if (S.chips.size) items = items.filter(x => S.chips.has(x.Scan));
  if (!items.length) return '';
  return `<h3>${title} <span class="small">${items.length} · ${sub}</span></h3>` + items.filter(hit).map(f => card(f, `From: ${esc(f.From)}. `)).join('');
}
function autoTab() {
  const [cls, val] = SCORE(D.score), [v, sub] = verdict(), j = D.job;
  const pct = j ? Math.round((j.done / j.total) * 100) : 0;
  const p = D.plan, per = {};
  p.forEach(x => per[x.Scan] = (per[x.Scan] || 0) + 1);
  const chips = Object.entries(D.scans).map(([k, s]) => `<span class="chip ${s.status === 'done' ? 'done' : s.status === 'running' ? 'running' : s.status === 'error' ? 'error' : ''}${S.chips.has(k) ? ' pick' : ''}" data-chip="${k}" title="${per[k] ? (S.chips.has(k) ? 'Click to remove these ' : 'Click to add these ') + per[k] + ' items. ' : 'Nothing to fix from this check. '}${s.at ? 'Finished ' + time(s.at) + ' in ' + s.secs + 's' : ''}">${esc(s.label)}${per[k] ? `<i class="cn">${per[k]}</i>` : ''}</span>`).join('');
  const scoreTip = S.chips.size ? 'Click to show everything again' : 'Security score out of 100. Click one or more checks on the right to see only their items, and click here to show everything again.';
  const hero = `<div class="hero"><div class="score ${cls}${S.chips.size ? ' filtered' : ''}" id="score" title="${scoreTip}">${val}${S.chips.size ? '<small>show all</small>' : ''}</div><div class="txt"><b class="v">${esc(v)}</b><span class="small">${esc(sub)}</span>${j ? `<div class="progress"><i style="width:${pct}%"></i></div>` : ''}<div class="chips">${chips}</div></div><button class="btn big solid" id="autopilot" ${j ? 'disabled' : ''}>${j ? `Scanning ${j.done + 1} of ${j.total}…` : 'Autopilot'}</button></div>`;
  // name only the sections that are on screen: "Fix now" appears only when something is critical or under attack
  const shown = [['now', 'Fix now'], ['week', 'This week'], ['later', 'When you have time']].filter(([k]) => p.some(x => x.Bucket === k)).map(([, l]) => `<b>${l}</b>`);
  const firstStep = !shown.length ? 'Nothing needs fixing right now.' : `Start with the list under ${shown[0]}${shown[1] ? `, then ${shown[1]}` : ''}: ${D.counts.critical ? 'critical items cost the most points' : 'each high item you fix adds about 6 points'}.`;
  const how = D.ran ? `<details class="how"${S.how ? ' open' : ''}><summary>How to read the score</summary><p>100 means none of the checks found anything worth fixing. Each problem takes points off: a <b>critical</b> one 18, a <b>high</b> one 6, a <b>medium</b> one 1.5 (at most 20 in all), and minor items at most 5 together. So a few high items lower it a lot, and many small ones can't sink it by themselves.</p><p><b>85 to 100</b> green: good. <b>65 to 84</b> amber: fair, fix the listed items when you can. <b>40 to 64</b> orange: poor, several important problems. <b>Below 40</b> red: many important problems.</p><p>Your ${D.score}: ${D.counts.critical} critical, ${D.counts.high} high, ${D.counts.medium} medium and ${D.counts.low} minor items. ${firstStep} Press the button on an item to fix it (items without a button say what to do), then run Autopilot again to update the score.</p><p>Click one or more checks on the right (the green labels) to see only their items. Click the circle to show everything again.</p></details>` : '';
  const adm = D.admin ? '' : '<div class="note"><b>My Security is not running as Administrator,</b> so some checks and all system fixes are unavailable. MySecurity.exe asks for it by itself.</div>';
  const picked = [...S.chips].filter(k => D.scans[k]), empty = picked.filter(k => !per[k]);
  const pick = picked.length ? `<div class="note">Showing only <b>${picked.map(k => esc(D.scans[k].label)).join('</b>, <b>')}</b> (${((n) => n + (n === 1 ? ' item' : ' items'))(picked.reduce((n, k) => n + (per[k] || 0), 0))}).${empty.length ? ` Nothing to fix from ${empty.map(k => esc(D.scans[k].label)).join(', ')}: minor items and what passed are in each tab.` : ''} Click more checks to add them, click a picked one to remove it, or click the score circle to show everything again.</div>` : '';
  return hero + how + adm + pick + bucket('Fix now', 'an attacker could use these today', p.filter(x => x.Bucket === 'now')) + bucket('This week', 'important, not an emergency', p.filter(x => x.Bucket === 'week')) + bucket('When you have time', 'worth doing', p.filter(x => x.Bucket === 'later')) +
    (D.ran ? `<p class="small">${D.counts.low} minor items and everything that passed are in each tab. The score is a rough guide: it can't prove that a PC is clean.</p>` : '');
}

function render() {
  if (!D) return;
  $('#meta').innerHTML = `[${esc(D.host)} · v${esc(D.version)}]` + (D.admin ? '' : ' · <span class="warn">not elevated: some checks and fixes are unavailable</span>');
  const c = D.counts, sc = D.score;
  $('#stats').innerHTML = [[sc == null ? '—' : sc, 'Security score', sc == null ? '' : sc >= 85 ? 'c-good' : ''], [c.critical, 'Critical', c.critical ? 'c-critical' : ''], [c.high, 'High', c.high ? 'c-high' : ''], [c.medium, 'Medium', c.medium ? 'c-medium' : ''], [D.events.filter(e => e.Running).length, 'Risky programs running', ''], [D.tabs.filter(t => t.Sev === 'critical' || t.Sev === 'high').length, 'Risky browser tabs', ''], [(D.blocks.ports || []).length + (D.blocks.programs || []).length + (D.blocks.ips || []).length + (D.blocks.sites || []).length, 'Blocked by you', '']].map(s => `<div class="stat ${s[2]}"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
  $('#tabs').innerHTML = TABS.map(([id, label, cats]) => {
    let n = cats.flatMap(k => D.scans[k].findings).filter(f => RANK[f.Sev] >= 2 && !f.Done);
    if (id === 'processes') n = D.events.filter(e => e.Running && RANK[e.Sev] >= 3);
    if (id === 'browsers') n = n.concat(D.tabs.filter(t => RANK[t.Sev] >= 3));
    if (id === 'quarantine') { const k = (D.blocks.quarantine || []).length; return `<button data-t="${id}" class="${id === S.tab ? 'on' : ''}">${label}${k ? `<span class="n medium">${k}</span>` : ''}</button>`; }
    const top = n.reduce((m, f) => Math.max(m, RANK[f.Sev]), 0);
    return `<button data-t="${id}" class="${id === 'auto' ? 'auto ' : ''}${id === S.tab ? 'on' : ''}">${label}${n.length ? `<span class="n ${top === 4 ? 'critical' : top === 2 ? 'medium' : ''}">${n.length}</span>` : ''}</button>`;
  }).join('');
  const scannable = TABS.find(t => t[0] === S.tab)[2];
  const rb = $('#rescan');
  rb.style.display = scannable.length ? '' : 'none'; rb.disabled = !!D.job;
  rb.textContent = D.job ? 'Scanning…' : 'Scan this tab';
  rb.title = D.job ? 'A scan is already running. This button works again once it finishes.' : '';
  $('#q').style.display = $('#problems').parentElement.style.display = S.tab === 'auto' || S.tab === 'blocked' || S.tab === 'quarantine' ? 'none' : '';
  // a redraw while someone types in the Blocked tab's port box would wipe it
  const keep = document.activeElement && document.activeElement.id === 'bport' ? $('#bport').value : null;
  const y = scrollY;
  QTIPS = {};
  $('#view').innerHTML = ({auto: autoTab, ports: portsTab, processes: processesTab, threats: threatsTab, browsers: browsersTab, blocked: blockedTab, quarantine: quarantineTab}[S.tab] || (() => genericTab(S.tab)))() + qSection(S.tab);
  if (keep !== null) { $('#bport').value = keep; $('#bport').focus(); }
  scrollTo(0, y);
}

let toastT = null;
function toast(r) { const t = $('#toast'); t.className = r.ok ? '' : 'bad'; t.textContent = r.message; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 9000); }
async function post(url, body) {
  try { const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-MySec-Token': TOKEN}, body: JSON.stringify(body || {})}); return await r.json(); }
  catch (e) { return {ok: false, message: 'The app is not running, so nothing was changed.'}; }
}
function lookup(id) { for (const s of Object.values(D.scans)) { const f = s.findings.find(x => x.Id === id); if (f) return f; } return (D.tabFindings || {})[id]; }
$('#tabs').onclick = e => { const b = e.target.closest('button[data-t]'); if (b) { S.tab = b.dataset.t; try { localStorage.setItem('mysec-tab', S.tab); } catch(x) {} render(); } };
$('#q').oninput = e => { S.q = e.target.value; render(); };
$('#problems').onchange = e => { S.problems = e.target.checked; render(); };
$('#rescan').onclick = async () => toast(await post('/scan', {keys: TABS.find(t => t[0] === S.tab)[2]}));
$('#openlog').onclick = async () => toast(await post('/openlog'));
$('#view').addEventListener('change', async e => { if (e.target.id === 'guard') { toast(await post('/guard', {on: e.target.checked})); } });
$('#view').onclick = async e => {
  const t = e.target;
  const go = t.closest('[data-goto]');
  if (go) { e.preventDefault(); S.tab = go.dataset.goto; try { localStorage.setItem('mysec-tab', S.tab); } catch (x) {} render(); scrollTo(0, 0); return; }
  if (t.closest('.how summary')) { S.how = !t.closest('details').open; return; }
  if (t.closest('.howtest summary')) { S.howtest = !t.closest('details').open; return; }
  const chip = t.closest('[data-chip]');
  if (chip) { const k = chip.dataset.chip; S.chips.has(k) ? S.chips.delete(k) : S.chips.add(k); return render(); }
  if (t.closest('#score')) { if (S.chips.size) { S.chips.clear(); render(); } return; }
  if (t.id === 'autopilot') { toast(await post('/autopilot')); return poll(true); }
  if (t.id === 'bbtn') { const port = +$('#bport').value, proto = $('#bproto').value; if (!(port >= 1 && port <= 65535)) return toast({ok: false, message: 'Type a port number from 1 to 65535.'}); if (!confirm(`Block incoming ${proto} port ${port}?\n\nOther devices will not be able to connect to it.`)) return; return toast(await post('/block-port', {port, proto})); }
  if (t.dataset.act) { const f = lookup(t.dataset.act); if (!f || !f.Action || !confirm(f.Action.confirm)) return; BUSY.add(f.Id); render(); const r = await post('/action', {id: f.Id}); BUSY.delete(f.Id); toast(r); return poll(true); }
  if (t.dataset.kill) { const ev = D.events.find(x => x.Id === +t.dataset.kill); if (!confirm(`End ${ev.Name} (PID ${ev.PID})?\n\nUnsaved work in it will be lost.`)) return; toast(await post('/kill', {id: ev.Id})); return poll(true); }
  if (t.dataset.blockp) { const ev = D.events.find(x => x.Id === +t.dataset.blockp); if (!confirm(`End and block ${ev.Name}?\n\n${ev.Path}\n\nIt will not be able to connect or start again until you unblock it in the Blocked tab.`)) return; toast(await post('/block-process', {id: ev.Id})); return poll(true); }
  if (t.dataset.unblock) { const k = t.dataset.unblock; if (!confirm(k === 'delete' ? 'Permanently delete this file?\n\nThis cannot be undone.' : k === 'restore' ? 'Put this file back where it was?' : 'Remove this block?')) return; toast(await post('/unblock', {kind: k, key: t.dataset.key})); return poll(true); }
  if (t.dataset.rec) { const on = t.dataset.rec === '1'; if (!confirm(on ? 'Start recording blocked attempts?\n\nWindows Firewall will write down every connection it refuses (up to 16 MB). You can stop it here anytime.' : 'Stop recording blocked attempts?\n\nWindows Firewall goes back to how it was before.')) return; t.disabled = true; toast(await post('/recording', {on})); return poll(true); }
  if (t.dataset.undo) { if (!confirm('Undo this change?')) return; toast(await post('/undo', {id: t.dataset.undo})); return poll(true); }
};
let stopped = false;
function closed() { stopped = true; window.close(); setTimeout(() => { document.body.innerHTML = '<header><h1>my_security</h1></header><div class="empty" style="font-size:16px;padding:60px 20px">The app has stopped. You can close this tab.</div>'; }, 300); }
$('#quit').onclick = async () => { if (!confirm('Stop My Security?\n\nLive watching of programs and browser tabs stops too.')) return; try { await fetch('/quit', {method: 'POST', headers: {'X-MySec-Token': TOKEN}}); } catch(e) {} closed(); };
addEventListener('pagehide', e => { if (!e.persisted && !stopped) navigator.sendBeacon('/tab-closed', TOKEN); });
let timer = null;
async function poll(once) {
  if (stopped) return;
  clearTimeout(timer);
  try {
    const r = await fetch('/data?rev=' + REV, {headers: {'X-MySec-Token': TOKEN}, cache: 'no-store'});
    if (r.status === 403) { $('#meta').textContent = 'The app restarted, reconnecting…'; setTimeout(() => location.reload(), 1000); return; }
    if (r.ok) { const d = await r.json(); if (d.stopping) return closed(); if (!d.same) { D = d; REV = d.rev; render(); if (D.notice && !noticeShown) { noticeShown = true; toast(D.notice); } } }
  } catch (e) { return closed(); }
  timer = setTimeout(poll, 2000);
}
let noticeShown = false;
poll();
</script>
</body>
</html>
