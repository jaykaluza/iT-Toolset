name = "nesiam-auth"
main = "worker.js"
compatibility_date = "2026-01-01"
# only the main address answers; no extra preview addresses
preview_urls = false

[vars]
# the address the code is sent from: it must belong to a domain you verified in Resend
FROM = "Nesiam <login@mail.nesiam.com>"
# only these websites may call the worker (comma separated)
ALLOWED_ORIGINS = "https://jaykaluza.github.io,https://nesiam.com,https://www.nesiam.com"

# stops people from spamming codes or guessing them: at most 3 codes and 5 tries per minute per email and per address
[[unsafe.bindings]]
name = "SEND_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[unsafe.bindings]]
name = "VERIFY_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
