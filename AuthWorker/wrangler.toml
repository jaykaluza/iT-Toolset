name = "nesiam-auth"
main = "worker.js"
compatibility_date = "2026-01-01"
# only the main address answers; no extra preview addresses
preview_urls = false

[vars]
# the address the code is sent from: it must belong to a domain you verified in Resend
FROM = "Nesiam <login@mail.nesiam.com>"
# only these websites may call the worker (comma separated)
ALLOWED_ORIGINS = "https://jaykaluza.github.io,https://nesiam.com,https://www.nesiam.com"
# most emails the worker will send in one day, across everyone (Resend's free plan allows 100)
DAILY_CAP = "90"

# one tiny object per email address: one code at a time, a wait between codes, 5 tries per code, each code works once
[[durable_objects.bindings]]
name = "GUARD"
class_name = "Guard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Guard"]

# extra per-address limits (3 codes and 5 tries a minute). If these ever break, the worker refuses requests instead of allowing them.
[[ratelimits]]
name = "SEND_LIMIT"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "VERIFY_LIMIT"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
